name: Feature request
description: Propose a new capability or integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: textarea
    id: specs
    attributes:
      label: Related specifications
      description: Existing specs in .ai/specs/ that this touches. Major features start as a draft spec (see .ai/specs/README.md).
