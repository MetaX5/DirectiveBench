name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job is a required check for pull requests (SPEC-012 §8). Jobs run in parallel.
jobs:
  lint:
    name: Lint, format, typecheck, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Audit production dependencies
        run: pnpm audit --prod
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests (100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Unit and package tests with the 100% coverage threshold
        run: pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          retention-days: 7

  # Linux and macOS are supported platforms (NFR-118-04); the same suite and the same 100%
  # threshold run on both (issue #120). Windows (best effort) is tracked separately.
  unit-macos:
    name: Unit tests (100% coverage, macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Unit and package tests with the 100% coverage threshold
        # --continue: every package reports its failures, not only the first one. The macOS runner
        # has 3 cores; seven parallel suites starved the timing and SQLite-lock tests there (run
        # 40959332904), so at most two packages run at once.
        run: pnpm test --continue --concurrency=2

  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Packaging verification (pack, install, help/version, demo, serve)
        run: pnpm verify:pack

  # The oldest Node that engines.node accepts (issue #263). node:sqlite bundles the SQLite of its
  # Node release, so SQL that the newer SQLite on Node 24 accepts can fail here (migration 0009
  # in PR #259: "no such column" before SQLite 3.53). Coverage is off: the 100% threshold is
  # enforced on Node 24 by `unit` and `unit-macos`; this job checks that the code runs there.
  # The apps/cli and apps/web unit tests do not pass on 22.16 yet (issues #265 and #266); the
  # packed CLI and web app run on it through verify:pack.
  oldest-node:
    name: Oldest supported Node (22.16.0)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OLDEST_NODE: 22.16.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.OLDEST_NODE }}
      - name: Node and SQLite versions, and the engines.node minimum
        run: |
          node -p '`Node ${process.version}, node:sqlite SQLite ${process.versions.sqlite}`'
          node -e '
            const { readFileSync } = require("node:fs");
            const expected = `>=${process.versions.node}`;
            for (const file of ["package.json", "apps/cli/package.json"]) {
              const declared = JSON.parse(readFileSync(file, "utf8")).engines?.node;
              if (declared !== expected) {
                console.error(`${file}: engines.node is ${declared}, this job runs ${expected}`);
                process.exit(1);
              }
            }'
      - name: Package and CLI tests (database migrations, runner, engine, adapters, core, cli) without coverage
        run: pnpm --filter "./packages/*" --filter directivebench --no-bail test --coverage.enabled=false
      - run: pnpm build
      - name: Packaging verification on the oldest Node (pack, install, demo, serve)
        run: pnpm verify:pack

  e2e:
    name: Integration tests (browser, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @directivebench/web exec playwright install --with-deps chromium
      - name: Browser tests against a temporary instance
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  storybook:
    name: Storybook (browser, both themes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm --filter @directivebench/web exec playwright install --with-deps chromium
      - name: Story tests (render, play functions, axe) in the light and dark themes
        run: pnpm test:storybook
      - name: Build the static Storybook
        run: pnpm --filter @directivebench/web build-storybook
