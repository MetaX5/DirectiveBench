name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job is a required check for pull requests (SPEC-012 §8). Jobs run in parallel.
jobs:
  lint:
    name: Lint, format, typecheck, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Audit production dependencies
        run: pnpm audit --prod
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests (100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Unit and package tests with the 100% coverage threshold
        run: pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          retention-days: 7

  # Linux, macOS and Windows are supported platforms (NFR-118-04, NFR-102-04; issue #120). The same
  # suite and the same 100% threshold run on each; POSIX-only tests are skipped on Windows by name.
  unit-macos:
    name: Unit tests (100% coverage, macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Unit and package tests with the 100% coverage threshold
        # --continue: every package reports its failures, not only the first one.
        run: pnpm test --continue

  unit-windows:
    name: Unit tests (100% coverage, Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Unit and package tests with the 100% coverage threshold
        run: pnpm test --continue

  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Packaging verification (pack, install, help/version, demo, serve)
        run: pnpm verify:pack

  e2e:
    name: Integration tests (browser, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @directivebench/web exec playwright install --with-deps chromium
      - name: Browser tests against a temporary instance
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  storybook:
    name: Storybook (browser, both themes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm --filter @directivebench/web exec playwright install --with-deps chromium
      - name: Story tests (render, play functions, axe) in the light and dark themes
        run: pnpm test:storybook
      - name: Build the static Storybook
        run: pnpm --filter @directivebench/web build-storybook
