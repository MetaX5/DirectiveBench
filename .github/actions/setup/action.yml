name: Set up pnpm workspace
description: Install Node.js, pnpm and the locked workspace dependencies.
inputs:
  node-version:
    description: >-
      Node.js version. Every job uses the default except `oldest-node`, which runs the
      `engines.node` minimum (issue #263).
    required: false
    default: '24'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
